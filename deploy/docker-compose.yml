# Облако «Конструктора ИД»: сервер, PostgreSQL, Caddy (HTTPS Let's Encrypt), ежедневная резервная копия базы.
# Переменные — в deploy/.env (создаёт install.sh): DOMAIN, POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: idk
      POSTGRES_USER: idk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idk -d idk"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://idk:${POSTGRES_PASSWORD}@db:5432/idk
      PUBLIC_URL: https://${DOMAIN:?нет DOMAIN в .env}
      PORT: "8080"
      ALLOWED_ORIGINS: https://localhost:3443,https://127.0.0.1:3443

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
