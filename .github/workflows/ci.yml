# 0.31: проверка каждого пуша и PR в main — типы, линт, формат, сборка панели, тесты.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: npm ci
      - name: Chromium для тестов печати
        run: npx playwright-core install --with-deps chromium
      - name: Шрифты для печатных форм (Liberation — метрики Times New Roman/Arial)
        run: sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core > /dev/null
      - name: Типы (shared, server, addin)
        run: npm run typecheck
      - name: Линт
        run: npm run lint
      - name: Формат
        run: npm run format:check
      - name: Сборка панели
        run: npm run build
      - name: Тесты
        run: npm test

  installer:
    name: Установщик
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_WIN_VERSION: "22.23.0"
      IDK_TG_TOKEN: ${{ secrets.IDK_TG_TOKEN }}
      IDK_TG_CHAT: ${{ secrets.IDK_TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - run: npm ci
      - name: Node.js для Windows
        run: |
          curl -fsSL -o node-win.zip "https://nodejs.org/dist/v${NODE_WIN_VERSION}/node-v${NODE_WIN_VERSION}-win-x64.zip"
          unzip -q -j node-win.zip "node-v${NODE_WIN_VERSION}-win-x64/node.exe" -d winnode
      - name: Сборка
        run: |
          VERSION=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' packages/addin/manifest.xml | sed 's/\.0$//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/build-installer.mjs winnode/node.exe "$VERSION"
      # Подпись — только если в секретах задан сертификат (SIGN_PFX_BASE64 + SIGN_PFX_PASSWORD).
      - name: Подпись
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        if: env.SIGN_PFX_BASE64 != ''
        run: |
          sudo apt-get install -y -qq osslsigncode > /dev/null
          echo "$SIGN_PFX_BASE64" | base64 -d > sign.pfx
          f="dist/KonstruktorID-Setup-${VERSION}.exe"
          osslsigncode sign -pkcs12 sign.pfx -pass "$SIGN_PFX_PASSWORD" -n "Конструктор ИД" -t http://timestamp.digicert.com -in "$f" -out signed.exe
          mv signed.exe "$f"
          rm -f sign.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: KonstruktorID-Setup-${{ env.VERSION }}
          path: dist/KonstruktorID-Setup-*.exe
          retention-days: 30
